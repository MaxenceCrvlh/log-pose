name: Art review sheets
on:
  workflow_dispatch:
  push:
    paths: ["tools/review_sheet.py", ".github/workflows/review.yml"]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install opencv-python-headless==4.10.0.84 numpy==2.1.3
      - uses: actions/cache/restore@v4
        with:
          path: .imgcache
          key: imgcache-none
          restore-keys: imgcache-
      - run: |
          python tools/review_sheet.py .imgcache review 15 70
          python tools/review_sheet.py .imgcache review 71 160
      - name: Publish to the review branch
        run: |
          cd review
          git init -q -b review && git add . 
          git -c user.name=log-pose-bot -c user.email=bot@users.noreply.github.com commit -qm "review sheets"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" review
