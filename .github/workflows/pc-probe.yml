name: PC probe
on:
  push:
    paths: [".github/workflows/pc-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 lxml
      - shell: python
        run: |
          import requests, json
          UA={"User-Agent":"log-pose-personal-collection/1.0 (weekly, low volume)"}
          r=requests.get("https://www.pricecharting.com/console/one-piece-japanese-romance-dawn?sort=&cursor=0&format=json",headers=UA,timeout=60)
          d=r.json(); p=d["products"]
          out={"top_keys":list(d.keys()),"cursor":d.get("cursor"),"n":len(p),"first":p[0],"sample_titles":[x.get("productName") for x in p[:5]]}
          open("probe.txt","w").write(json.dumps(out,indent=1)[:5000])
      - run: |
          mkdir o && mv probe.txt o/ && cd o && git init -q -b pcprobe && git add . && git -c user.name=b -c user.email=b@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pcprobe
