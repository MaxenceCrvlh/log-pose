name: Update prices

on:
  schedule:
    - cron: "41 7 * * 2"        # every Tuesday, after the card list update (weekly)
  workflow_dispatch:
  push:
    paths:
      - "tools/pc_prices.py"
      - ".github/workflows/prices.yml"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 opencv-python-headless==4.10.0.84 numpy==2.1.3 cryptography==43.0.3
      - name: Restore PriceCharting thumbnails
        uses: actions/cache@v4
        with:
          path: .pccache
          key: pccache-${{ github.run_id }}
          restore-keys: pccache-
      - name: Fetch prices (personal use, low volume)
        env:
          PRICE_PASSPHRASE: ${{ secrets.PRICE_PASSPHRASE }}
        run: python tools/pc_prices.py --img-cache .pccache
      - name: Save if changed
        run: |
          git config user.name "log-pose-bot"
          git config user.email "log-pose-bot@users.noreply.github.com"
          git add data/pc_map.json data/prices.enc data/pc_report.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update prices" && git pull --rebase -q && git push; fi
