<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poneglyph">
<meta name="description" content="Free kanji and Japanese vocabulary flashcards with spaced repetition. Your progress stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Poneglyph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Klee+One:wght@600&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --surface2:#ECE9E2; --ink:#1B1A17; --muted:#6B675F; --line:#DEDAD1;
  --primary:#1B1A17; --on-primary:#FFFFFF; --accent:#6A4BC4; --accent-soft:#ECE6FA;
  --st0:#1B1A17; --st1:#D8382C; --st2:#C68A00; --st3:#1C9450; --st4:#2266D6;
  --st1-soft:#FBE3E0; --st2-soft:#FAF0D4; --st3-soft:#DDF3E5; --st4-soft:#E0EAFB; --st0-soft:#E9E6DF;
  --shadow:0 1px 2px rgba(27,26,23,.05),0 6px 22px rgba(27,26,23,.08);
  --jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,var(--jp);
  --brand:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --cardfont:var(--jp);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121316; --surface:#1B1D21; --surface2:#26292F; --ink:#ECE9E2; --muted:#9C988F; --line:#30333A;
  --primary:#ECE9E2; --on-primary:#121316; --accent:#A48CF0; --accent-soft:#2A2440;
  --st0:#ECE9E2; --st1:#FF6A5C; --st2:#F2B92E; --st3:#3DCB7B; --st4:#5E9CFF;
  --st1-soft:#3D1F1C; --st2-soft:#3A3016; --st3-soft:#16301F; --st4-soft:#1A2740; --st0-soft:#26292F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121316; --surface:#1B1D21; --surface2:#26292F; --ink:#ECE9E2; --muted:#9C988F; --line:#30333A;
  --primary:#ECE9E2; --on-primary:#121316; --accent:#A48CF0; --accent-soft:#2A2440;
  --st0:#ECE9E2; --st1:#FF6A5C; --st2:#F2B92E; --st3:#3DCB7B; --st4:#5E9CFF;
  --st1-soft:#3D1F1C; --st2-soft:#3A3016; --st3-soft:#16301F; --st4-soft:#1A2740; --st0-soft:#26292F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
:root[data-font="textbook"]{--cardfont:"Klee One",var(--jp)}
:root[data-font="serif"]{--cardfont:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
*{box-sizing:border-box}
html{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;height:100%;overflow:hidden;margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button,a,label{touch-action:manipulation}
a{color:var(--accent)}
.jp{font-family:var(--jp)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* app frame */
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 28px}
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(12px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--st1);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}

/* top bars */
.top{display:flex;align-items:center;gap:10px;padding:10px 0 6px;min-height:52px}
.top h1{margin:0;font-family:var(--brand);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1.1;flex:1}
.top h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto}
.bar .title{flex:1;text-align:center;font-weight:700;font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:0 0 auto}
.icon-btn svg{width:20px;height:20px}
.icon-btn.ghost{background:none;border-color:transparent}
.icon-btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 8px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--surface2);color:var(--ink);border:1px solid transparent;min-height:44px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.accent{background:var(--accent);color:#fff}
.btn.block{width:100%}
.btn.small{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--st1)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:34px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=search],input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
input[type=search]:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}

/* status colors */
.s0{color:var(--st0)} .s1{color:var(--st1)} .s2{color:var(--st2)} .s3{color:var(--st3)} .s4{color:var(--st4)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;flex:0 0 auto}
.dot.s0{background:var(--st0)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.s0{background:var(--st0-soft)} .pill.s1{background:var(--st1-soft)} .pill.s2{background:var(--st2-soft)} .pill.s3{background:var(--st3-soft)} .pill.s4{background:var(--st4-soft)}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.mbar i{display:block;height:100%}
.mbar .b1{background:var(--st1)} .mbar .b2{background:var(--st2)} .mbar .b3{background:var(--st3)} .mbar .b4{background:var(--st4)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{color:var(--ink);font-weight:600}
.legend button{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink)}
.legend button[aria-pressed="false"]{opacity:.4}

/* library cards */
.deck{position:relative;overflow:hidden}
.deck .bgk{position:absolute;right:-6px;top:-14px;font-family:var(--brand);font-size:84px;font-weight:800;opacity:.07;pointer-events:none;line-height:1}
.deck h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.deck .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.lvl{background:var(--surface2);border-radius:10px;padding:7px 9px;text-align:left}
.lvl b{display:block;font-size:14px}
.lvl small{font-size:11px;color:var(--muted)}
.lvl .mbar{height:4px;margin-top:5px}
.today{display:flex;align-items:center;gap:12px}
.today .big{font-size:30px;font-weight:800;line-height:1}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;max-width:160px}
.recent .c{font-family:var(--jp);font-size:24px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:600}
.linkrow:last-child{border-bottom:0}
.linkrow .muted{font-weight:400;font-size:13px}
.linkrow svg{width:18px;height:18px;color:var(--muted)}

/* kanji grid */
.sect{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 2px 6px;font-weight:700;font-size:14px}
.sect .mbar{flex:1;height:5px;max-width:160px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px;margin-bottom:6px}
.grid button{font-family:var(--jp);font-size:28px;line-height:1;aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-weight:500}
.grid button:active{background:var(--surface2)}
.grid button.q{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* word list */
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .w{font-family:var(--jp);font-size:19px;font-weight:700;line-height:1.25}
.wrow .r{font-family:var(--jp);font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.wrow .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .kc{font-family:var(--jp);font-size:28px;font-weight:700;width:40px;text-align:center;flex:0 0 auto}
.tag{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--muted);flex:0 0 auto}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:61;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet.short{top:auto;max-height:85%}
.sheet .bar{border-radius:18px 18px 0 0}
.sheet .scroller{padding-bottom:env(safe-area-inset-bottom,0px)}

/* detail */
.hero{text-align:center;padding:12px 0 4px}
.hero .big{font-family:var(--cardfont);font-size:110px;line-height:1.1;font-weight:500}
.hero .bigw{font-family:var(--cardfont);font-size:52px;line-height:1.2;font-weight:700;word-break:keep-all}
.hero .rd{font-family:var(--jp);font-size:18px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.facts b{display:block;font-size:17px}
.facts small{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.kv dt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:0;font-family:var(--jp);font-size:17px}
.oku{color:var(--muted)}
.means{font-size:20px;font-weight:700;line-height:1.3}
.sense{padding:8px 0;border-bottom:1px solid var(--line)}
.sense:last-child{border-bottom:0}
.sense .pos{font-size:12px;color:var(--accent);font-weight:600}
.sense .gl{font-size:15px}
.sense .mi{font-size:12px;color:var(--muted)}
.ex{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ex .ja{font-family:var(--jp);font-size:17px;line-height:1.6}
.ex .ja mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.ex .en{font-size:14px;color:var(--muted)}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px;text-align:left}
.kchip .c{font-family:var(--jp);font-size:28px;font-weight:700;line-height:1}
.kchip .m{font-size:12px;color:var(--muted);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strokes{display:flex;gap:12px;align-items:center}
.strokes svg{width:150px;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;flex:0 0 auto}
.strokes svg .grid-l{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2}
.strokes svg path.st{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.strokes svg path.st.ghost{stroke:var(--line)}
.strokes svg text{font-size:7px;fill:var(--accent);font-family:var(--body);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* study session */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sess-top{display:flex;align-items:center;gap:10px;padding:8px 12px}
.prog{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.counts{font-size:13px;font-weight:700;display:flex;gap:8px}
.fc{flex:1;min-height:0;display:flex;flex-direction:column;margin:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.fc .inner{flex:1;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column}
.fc .kind{position:absolute;left:14px;top:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fc .spk{position:absolute;right:10px;top:8px}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:180px;gap:6px}
.front .fk{font-family:var(--cardfont);font-size:min(150px,36vw);line-height:1.1;font-weight:500}
.front .fw{font-family:var(--cardfont);font-size:min(64px,13vw);line-height:1.25;font-weight:700;word-break:keep-all}
.front .fr{font-family:var(--jp);color:var(--muted);font-size:18px}
.front .fm{font-size:24px;font-weight:700;line-height:1.3;max-width:520px}
.front .hint{font-size:13px;color:var(--muted)}
.fc.revealed .front{flex:0 0 auto;min-height:0;padding-top:18px}
.fc.revealed .front .fk{font-size:min(110px,28vw)}
.fc.revealed .front .fw{font-size:min(48px,11vw)}
.back{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.back .stack>*+*{margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.grades button{border-radius:14px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;color:#fff}
.grades button small{font-size:11px;font-weight:600;opacity:.85}
.g1{background:var(--st1)} .g2{background:var(--st2)} .g3{background:var(--st3)} .g4{background:var(--st4)}
.reveal{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.reveal .btn{width:100%;min-height:58px;font-size:17px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
.done .big{font-family:var(--brand);font-size:72px;line-height:1}
.donegrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px}
.donegrid button{font-family:var(--jp);font-size:22px;font-weight:700;padding:2px 6px;border-radius:8px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px}
.bars span{font-size:10px;color:var(--muted)}
.lvrow{display:grid;grid-template-columns:44px 1fr 70px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.lvrow .mbar{height:10px}

/* settings */
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .grow b{display:block;font-weight:600}
.set .grow small{color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:18px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:0 0 auto;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--st3)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.loading{text-align:center;color:var(--muted);padding:20px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}.grid button{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- LIBRARY -->
  <section class="view" id="v-lib">
    <div class="scroller" id="lib-scroll"><div class="wrap" id="lib"></div></div>
  </section>
  <!-- STUDY -->
  <section class="view" id="v-study" hidden>
    <div class="scroller"><div class="wrap" id="study"></div></div>
  </section>
  <!-- STATS -->
  <section class="view" id="v-stats" hidden>
    <div class="scroller"><div class="wrap" id="stats"></div></div>
  </section>
  <!-- SETTINGS -->
  <section class="view" id="v-set" hidden>
    <div class="scroller"><div class="wrap" id="settings"></div></div>
  </section>
  <!-- BROWSE PAGES (kanji grid, vocabulary, search) -->
  <section class="view" id="v-page" hidden>
    <div class="bar">
      <button class="icon-btn ghost" data-act="page-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="title" id="page-title"></div>
      <button class="icon-btn ghost" id="page-filter" data-act="filter" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    </div>
    <div class="scroller" id="page-scroll"><div class="wrap" id="page"></div></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="lib" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16.5 5.2l3.4-.9 3 15.5-3.4.9z" transform="translate(-2 0)"/></svg>Library</button>
    <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Study<span class="badge" id="due-badge" hidden></span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</button>
    <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="bar">
    <button class="icon-btn ghost" data-act="sheet-back" id="sheet-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="title" id="sheet-title"></div>
    <button class="icon-btn ghost" data-act="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="scroller" id="sheet-scroll"><div class="wrap" id="sheet-body"></div></div>
</div>
<div class="session" id="session" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============================================================
   Poneglyph — kanji & vocabulary flashcards
   Everything you study is saved on this device only (localStorage).
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const DAY = 864e5;
const STORE = "poneglyph-v1";
const STATUS = ["New", "Weak", "Learning", "Good", "Known"];
const STATUS_HELP = ["never studied", "missed last time", "interval under a week", "interval 1–3 weeks", "interval 3 weeks or more"];
const LEVELS = [5, 4, 3, 2, 1];

/* ---------- persistent state ---------- */
const DEFAULTS = {
  newK: 10, newV: 10, maxRev: 200,
  dirK: "k2m", dirV: "j2e", furi: false, autoSpeak: false,
  font: "sans", theme: "auto",
  decks: ["k", "v"], levels: [5, 4], incOther: false, incMine: true,
  custStatus: [1, 2], custCount: 20, custOrder: "random",
  group: "jlpt"
};
let P = load();
function load() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
  p = p || {};
  p.v = 1; p.cards = p.cards || {}; p.days = p.days || {}; p.my = p.my || []; p.notes = p.notes || {};
  p.queue = p.queue || []; p.recent = p.recent || []; p.star = p.star || [];
  p.set = Object.assign({}, DEFAULTS, p.set || {});
  p.created = p.created || Date.now();
  return p;
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const w = () => { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) { toast("Couldn't save — storage full?"); } };
  if (now) w(); else saveTimer = setTimeout(w, 250);
}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function applyLook() {
  const r = document.documentElement;
  if (P.set.theme === "auto") r.removeAttribute("data-theme"); else r.dataset.theme = P.set.theme;
  if (P.set.font === "sans") r.removeAttribute("data-font"); else r.dataset.font = P.set.font;
}
applyLook();

/* ---------- days ---------- */
// study day rolls over at 4 am local time
function today() { const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset() * 6e4 - 4 * 3600e3) / DAY); }
function dayStat(d) { return P.days[d] || (P.days[d] = {r: 0, c: 0, nk: 0, nv: 0}); }

/* ---------- data ---------- */
let K = [], KM = new Map();        // kanji list, char -> kanji
let D = null, DM = new Map();      // dictionary words, id -> word
let KW = new Map();                // kanji char -> word ids containing it
let dictPromise = null;
const isKanji = ch => /[㐀-鿿豈-﫿々]/.test(ch);
const hira2kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

async function loadKanji() {
  const r = await fetch("data/kanji.json");
  K = await r.json();
  K.forEach((k, i) => { k.o = i; KM.set(k.c, k); });
}
function loadDict() {
  if (!dictPromise) dictPromise = fetch("data/dict.json").then(r => r.json()).then(j => {
    D = j.words;
    D.forEach((w, i) => {
      w.o = i;
      DM.set(w.i, w);
      w.hw = w.h || (w.u || !w.k.length ? w.r[0] : w.k[0]);
      const seen = new Set();
      for (const ch of (w.k[0] || w.hw)) if (KM.has(ch) && !seen.has(ch)) { seen.add(ch); (KW.get(ch) || KW.set(ch, []).get(ch)).push(w.i); }
    });
    const rank = w => (w.j ? (6 - w.j) * 10 : 70) + (w.c ? 0 : 5) + Math.min(w.hw.length, 6) * .1;
    for (const ids of KW.values()) ids.sort((a, b) => rank(DM.get(a)) - rank(DM.get(b)));
    return D;
  });
  return dictPromise;
}

/* ---------- cards & scheduling ---------- */
// card id: "k" + kanji char, or "v" + dictionary id
const cardOf = id => P.cards[id];
function level(id) {
  const c = P.cards[id];
  if (!c) return 0;
  if (c.g === 1 || c.i < 1) return 1;
  if (c.i < 7) return 2;
  if (c.i < 21) return 3;
  return 4;
}
function schedule(prev, g, isDue) {
  const t = today();
  const c = prev ? Object.assign({}, prev) : {i: 0, e: 2.5, d: t, r: 0, l: 0, n: 0, c: 0};
  c.n = (c.n || 0) + 1; if (g >= 2) c.c = (c.c || 0) + 1;
  c.t = Date.now();
  // extra practice on a card that isn't due yet: a miss still counts, a pass leaves the schedule alone
  if (!isDue && g >= 2 && prev && prev.i >= 1) { c.g = g; return c; }
  if (g === 1) {
    if (c.r > 0 || c.i >= 1) c.l = (c.l || 0) + 1;
    c.r = 0; c.i = 0; c.e = Math.max(1.3, c.e - .2); c.d = t;
  } else {
    let i;
    if (g === 2) { i = c.i < 1 ? 1 : Math.max(c.i + 1, Math.round(c.i * 1.2)); c.e = Math.max(1.3, c.e - .15); }
    else if (g === 3) { i = c.i < 1 ? 1 : c.i < 3 ? 3 : Math.round(c.i * c.e); }
    else { i = c.i < 1 ? 4 : Math.round(Math.max(c.i + 2, c.i * c.e * 1.3)); c.e = c.e + .15; }
    if (i >= 7) i = Math.round(i * (0.95 + Math.random() * .1));
    c.i = Math.min(i, 3650); c.r++; c.d = t + c.i;
  }
  c.g = g;
  return c;
}
function ivlLabel(c, g) {
  if (g === 1) return "again";
  const d = c.i;
  if (d < 30) return d + "d";
  if (d < 365) return Math.round(d / 30) + "mo";
  return (d / 365).toFixed(1).replace(".0", "") + "y";
}
function isDue(id) { const c = P.cards[id]; return !!c && c.d <= today(); }
function markKnown(id) {
  const prev = P.cards[id] || {n: 0, c: 0, l: 0};
  P.cards[id] = Object.assign({}, prev, {i: 60, e: 2.6, d: today() + 60, r: Math.max(3, prev.r || 0), g: 4, t: Date.now(), k: 1});
  P.queue = P.queue.filter(x => x !== id);
  save(); refreshAll();
}
function resetCard(id) { delete P.cards[id]; save(); refreshAll(); }

/* ---------- item helpers ---------- */
const kId = ch => "k" + ch;
const vId = w => "v" + w.i;
function itemOf(id) { return id[0] === "k" ? KM.get(id.slice(1)) : DM.get(id.slice(1)); }
function okuri(s) { // なが.い -> なが<span>い</span>
  const [a, b] = s.split(".");
  return esc(a) + (b ? `<span class="oku">${esc(b)}</span>` : "");
}
function kMeaning(k) { return k.m.slice(0, 3).join(", "); }
function wMeaning(w, n = 1) { return w.s.slice(0, n).map(s => s[1]).join(" · "); }
function wordsFor(ch) { return (KW.get(ch) || []).map(i => DM.get(i)); }
function statusCounts(ids) {
  const n = [0, 0, 0, 0, 0];
  for (const id of ids) n[level(id)]++;
  return n;
}
function mbar(n) {
  const tot = n.reduce((a, b) => a + b, 0) || 1;
  return `<div class="mbar">${[4, 3, 2, 1].map(s => n[s] ? `<i class="b${s}" style="width:${(n[s] / tot * 100).toFixed(2)}%"></i>` : "").join("")}</div>`;
}
function legend(n) {
  return `<div class="legend">${[0, 1, 2, 3, 4].map(s => `<span><i class="dot s${s}"></i>${STATUS[s]} <b class="num">${fmt(n[s])}</b></span>`).join("")}</div>`;
}
function vocabIds() { // the vocabulary deck: every JLPT word + your own words
  if (!D) return [];
  const ids = [];
  for (const w of D) if (w.j) ids.push(vId(w));
  for (const i of P.my) if (DM.has(i) && !DM.get(i).j) ids.push("v" + i);
  return ids;
}
function addRecent(id) {
  P.recent = [id, ...P.recent.filter(x => x !== id)].slice(0, 16);
  save();
}

/* ---------- speech ---------- */
let jaVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  jaVoice = vs.find(v => /kyoko|otoya|google/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = .9;
  speechSynthesis.speak(u);
}
const SPK = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const CHEV = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---------- romaji -> kana (for search) ---------- */
const ROMA = (() => {
  const m = {a:"あ",i:"い",u:"う",e:"え",o:"お",n:"ん",nn:"ん","n'":"ん","-":"ー",
    ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
    sa:"さ",si:"し",shi:"し",su:"す",se:"せ",so:"そ",za:"ざ",zi:"じ",ji:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",
    ta:"た",ti:"ち",chi:"ち",tu:"つ",tsu:"つ",te:"て",to:"と",da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",
    na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",ha:"は",hi:"ひ",hu:"ふ",fu:"ふ",he:"へ",ho:"ほ",
    ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",
    ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",ya:"や",yu:"ゆ",yo:"よ",ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",
    wa:"わ",wo:"を",we:"うぇ",wi:"うぃ",fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",
    sha:"しゃ",shu:"しゅ",sho:"しょ",she:"しぇ",cha:"ちゃ",chu:"ちゅ",cho:"ちょ",che:"ちぇ",ja:"じゃ",ju:"じゅ",jo:"じょ",je:"じぇ",
    tsa:"つぁ",xtu:"っ",ltu:"っ"};
  for (const [c, k] of Object.entries({k:"き",g:"ぎ",s:"し",z:"じ",t:"ち",d:"ぢ",n:"に",h:"ひ",b:"び",p:"ぴ",m:"み",r:"り"}))
    { m[c + "ya"] = k + "ゃ"; m[c + "yu"] = k + "ゅ"; m[c + "yo"] = k + "ょ"; }
  return m;
})();
function romaji2kana(s) {
  s = s.toLowerCase(); let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === s[i + 1] && /[bcdfghjkmprstwz]/.test(c)) { out += "っ"; i++; continue; }
    let hit = false;
    for (let L = 3; L >= 1; L--) {
      const part = s.substr(i, L);
      if (ROMA[part] && !(part === "n" && /[aiueoy]/.test(s[i + 1] || ""))) { out += ROMA[part]; i += L; hit = true; break; }
    }
    if (!hit) return null;
  }
  return out;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
let tab = "lib", page = null; // page: {type:'kanji'|'vocab'|'search', ...}
function showTab(t) {
  tab = t; page = null;
  $$("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["lib", "study", "stats", "set"].forEach(v => $("#v-" + v).hidden = v !== t);
  $("#v-page").hidden = true;
  render();
}
function openPage(p) {
  page = p;
  ["lib", "study", "stats", "set"].forEach(v => $("#v-" + v).hidden = true);
  $("#v-page").hidden = false;
  $("#page-scroll").scrollTop = 0;
  renderPage();
  if (p.type === "search") setTimeout(() => $("#q") && $("#q").focus(), 50);
}
function render() {
  if (tab === "lib") renderLib();
  else if (tab === "study") renderStudy();
  else if (tab === "stats") renderStats();
  else if (tab === "set") renderSettings();
  updateBadge();
}
function refreshAll() {
  if (page) { const y = $("#page-scroll").scrollTop; renderPage(); $("#page-scroll").scrollTop = y; } else render();
  if (sheetStack.length) renderSheet(true);
  updateBadge();
}
function updateBadge() {
  const t = today(); let n = 0;
  for (const id in P.cards) if (P.cards[id].d <= t) n++;
  const b = $("#due-badge"); b.hidden = !n; b.textContent = n > 99 ? "99+" : n;
}

/* ============================================================
   LIBRARY
   ============================================================ */
function renderLib() {
  const kIds = K.map(k => kId(k.c));
  const kn = statusCounts(kIds);
  const vIds = vocabIds();
  const vn = statusCounts(vIds);
  const plan = D ? planDaily() : null;
  const lvlBtn = (type, l, ids, label) => {
    const n = statusCounts(ids);
    const done = n[2] + n[3] + n[4];
    return `<button class="lvl" data-act="browse" data-type="${type}" data-lvl="${l}"><b>${label}</b><small class="num">${fmt(done)} / ${fmt(ids.length)}</small>${mbar(n)}</button>`;
  };
  let h = `<div class="top"><h1>Poneglyph<small>Kanji &amp; vocabulary flashcards</small></h1>
    <button class="icon-btn" data-act="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div>`;

  // today
  if (plan) {
    const total = plan.due.length + plan.fresh.length;
    h += `<div class="card today" style="margin-top:6px"><div class="grow"><div class="label">Today</div>
      <div class="row" style="gap:16px;margin-top:4px"><div><div class="big num">${plan.due.length}</div><div class="small muted">to review</div></div>
      <div><div class="big num">${plan.fresh.length}</div><div class="small muted">new</div></div></div></div>
      <button class="btn primary" data-act="start-daily" ${total ? "" : "disabled"}>${total ? "Study" : "All done"}</button></div>`;
  }

  h += `<h2>Library</h2><div class="stack">`;
  h += `<div class="card deck"><div class="bgk">漢字</div><h3>Kanji</h3><div class="sub">${fmt(K.length)} characters · Jōyō + JLPT</div>${mbar(kn)}${legend(kn)}
    <div class="lvls">${LEVELS.map(l => lvlBtn("kanji", l, K.filter(k => k.j === l).map(k => kId(k.c)), "N" + l)).join("")}
    ${lvlBtn("kanji", 0, K.filter(k => !k.j).map(k => kId(k.c)), "Other")}</div>
    <button class="btn block" style="margin-top:10px" data-act="browse" data-type="kanji">Browse all kanji</button></div>`;
  if (D) {
    h += `<div class="card deck"><div class="bgk">語彙</div><h3>Vocabulary</h3><div class="sub">${fmt(vIds.length)} words · JLPT N5–N1${P.my.length ? " + your words" : ""}</div>${mbar(vn)}${legend(vn)}
      <div class="lvls">${LEVELS.map(l => lvlBtn("vocab", l, D.filter(w => w.j === l).map(vId), "N" + l)).join("")}
      ${lvlBtn("vocab", "my", P.my.map(i => "v" + i), "My words")}</div>
      <button class="btn block" style="margin-top:10px" data-act="search">Look up any word</button></div>`;
  } else h += `<div class="card loading">Loading the dictionary…</div>`;
  h += `</div>`;

  if (P.recent.length && D) {
    h += `<h2>Recently viewed</h2><div class="recent">${P.recent.map(id => {
      const it = itemOf(id); if (!it) return "";
      const isK = id[0] === "k";
      return `<button data-act="open" data-id="${esc(id)}"><div class="c s${level(id)}">${esc(isK ? it.c : it.hw)}</div><div class="m">${esc(isK ? kMeaning(it) : wMeaning(it))}</div></button>`;
    }).join("")}</div>`;
  }
  const mine = P.queue.length;
  h += `<h2>More</h2><div class="card" style="padding:2px 14px">
    <button class="linkrow" data-act="browse" data-type="vocab" data-lvl="my"><span class="grow">My words</span><span class="muted num">${P.my.length}</span>${CHEV}</button>
    <button class="linkrow" data-act="queue"><span class="grow">Learn next queue</span><span class="muted num">${mine}</span>${CHEV}</button>
    <button class="linkrow" data-act="tab" data-tab="set"><span class="grow">Backup your progress</span><span class="muted">${P.lastBackup ? "last " + new Date(P.lastBackup).toLocaleDateString() : "never"}</span>${CHEV}</button>
  </div>`;
  $("#lib").innerHTML = h;
}

/* ============================================================
   BROWSE PAGES
   ============================================================ */
const filt = {kanji: {lv: null, st: [0, 1, 2, 3, 4], q: ""}, vocab: {lv: 5, st: [0, 1, 2, 3, 4], q: ""}};
function renderPage() {
  const p = page; if (!p) return;
  $("#page-filter").hidden = p.type === "search";
  if (p.type === "kanji") renderKanjiPage();
  else if (p.type === "vocab") renderVocabPage();
  else if (p.type === "search") renderSearchPage();
  else if (p.type === "queue") renderQueuePage();
}
function stButtons(f) {
  return `<div class="legend" style="margin:4px 0 6px">${[0, 1, 2, 3, 4].map(s => `<button data-act="st-toggle" data-s="${s}" aria-pressed="${f.st.includes(s)}"><i class="dot s${s}"></i>${STATUS[s]}</button>`).join("")}</div>`;
}
function renderKanjiPage() {
  const f = filt.kanji;
  const g = P.set.group;

function search(qRaw) {
  const q = qRaw.trim(); if (!q) return {ks: [], ws: []};
  const low = q.toLowerCase();
  const latin = /^[a-z' \-]+$/i.test(q);
  const kana = latin ? romaji2kana(low.replace(/\s+/g, "")) : (/^[぀-ヿー]+$/.test(q) ? kata2hira(q) : null);
  let ks = [], ws = [];
  const chars = [...q].filter(c => KM.has(c));
  if (chars.length) ks = [...new Set(chars)].map(c => KM.get(c));
  else {
    if (kana) ks = K.filter(k => k.on.concat(k.kun).some(r => r.replace(/[.\-]/g, "") === kana));
    if (latin) {
      const re = new RegExp("\\b" + low.replace(/[^a-z' ]/g, "") + "\\b");
      ks = ks.concat(K.filter(k => k.m.some(m => re.test(m.toLowerCase()))).sort((a, b) => (a.m[0].toLowerCase() === low ? 0 : 1) - (b.m[0].toLowerCase() === low ? 0 : 1)));
    }
    ks = [...new Set(ks)];
  }
  if (D) {
    const scored = [];
    const re = latin ? new RegExp("(^|[;,(] ?|\\bto )" + low.replace(/[^a-z' ]/g, "") + "($|[;,)]| \\()") : null;
    const reLoose = latin ? new RegExp("\\b" + low.replace(/[^a-z' ]/g, "") + "\\b") : null;
    for (const w of D) {
      let s = 0;
      if (!latin) {
        if (w.k.includes(q) || w.hw === q) s = 100;
        else if (w.r.some(r => r === q || kata2hira(r) === kana)) s = 95;
        else if (w.k.some(k => k.startsWith(q)) || (kana && w.r.some(r => kata2hira(r).startsWith(kana)))) s = 60;
        else if (q.length > 1 && w.k.some(k => k.includes(q))) s = 40;
      } else {
        if (kana && kana.length > 1 && w.r.some(r => kata2hira(r) === kana)) s = 95;
        const g0 = w.s[0][1].toLowerCase();
        if (re.test(g0)) s = Math.max(s, 90 - Math.min(g0.length, 40) / 4);
        else if (w.s.some(x => re.test(x[1].toLowerCase()))) s = Math.max(s, 55);
        else if (reLoose.test(g0)) s = Math.max(s, 40);
        if (!s && kana && kana.length > 1 && w.r.some(r => kata2hira(r).startsWith(kana))) s = 30;
      }
      if (s) { s += (w.c ? 6 : 0) + (w.j ? 2 + w.j : 0); scored.push([s, w]); }
    }
    scored.sort((a, b) => b[0] - a[0] || a[1].hw.length - b[1].hw.length);
    ws = scored.slice(0, 60).map(x => x[1]);
  }
  return {ks: ks.slice(0, 24), ws};
}
function runSearch() {
  const box = $("#results"); if (!box) return;
  const q = (page && page.q) || "";
  if (!q.trim()) { box.innerHTML = `<div class="empty">Search the dictionary in English (“water”), romaji (“mizu”), kana (みず) or kanji (水).<br><br>Tap a result to see meanings, example sentences and the kanji inside it.</div>`; return; }

  if (!h) h = `<div class="empty">Nothing found for “${esc(q)}”.</div>`;
  box.innerHTML = h;
}

/* stroke order (KanjiVG) */
const strokeCache = new Map();
async function drawStrokes(ch, svg, animate) {
  const hx = ch.codePointAt(0).toString(16).padStart(5, "0");
  let paths = strokeCache.get(ch);
  if (!paths) {
    try { paths = await (await fetch(`data/strokes/${hx}.json`)).json(); strokeCache.set(ch, paths); }
    catch (e) { svg.parentElement.innerHTML = `<p class="note">Stroke order isn't available offline until you've opened this kanji once online.</p>`; return; }
  }
  if (!svg.isConnected) return;
  const grid = `<path class="grid-l" d="M54.5 0V109M0 54.5H109"/>`;
  svg.innerHTML = grid + paths.map((d, i) => `<path class="st ghost" d="${d}"/>`).join("") + paths.map((d, i) => `<path class="st" data-i="${i}" d="${d}"/>`).join("") + paths.map((d, i) => { const m = d.match(/^M\s*([\d.]+)[ ,]([\d.]+)/); return m ? `<text x="${+m[1] - 5}" y="${+m[2] - 2}">${i + 1}</text>` : ""; }).join("");
  if (animate) animateStrokes(svg);
}
function animateStrokes(svg) {
  const ps = $$("path.st:not(.ghost)", svg);
  const texts = $$("text", svg);
  ps.forEach(p => { const L = p.getTotalLength(); p.style.transition = "none"; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  texts.forEach(t => t.style.opacity = 0);
  let i = 0;
  const step = () => {
    if (i >= ps.length || !svg.isConnected) return;
    const p = ps[i], L = p.getTotalLength(), ms = Math.max(250, L * 9);
    texts[i] && (texts[i].style.opacity = 1);
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${ms}ms linear`;
    p.style.strokeDashoffset = 0;
    i++; setTimeout(step, ms + 120);
  };
  setTimeout(step, 150);
}

function poolIds(opts = P.set) {
  const ids = [];
  const lv = new Set(opts.levels);
  if (opts.decks.includes("k")) for (const k of K) if (k.j ? lv.has(k.j) : opts.incOther) ids.push(kId(k.c));
  if (opts.decks.includes("v") && D) {
    for (const w of D) if (w.j && lv.has(w.j)) ids.push(vId(w));
    if (opts.incMine) for (const i of P.my) if (DM.has(i) && !DM.get(i).j) ids.push("v" + i);
  }
  return ids;
}
function planDaily() {

let S = null;

}
function startDaily() { const p = planDaily(); startSession(interleave(p.due, p.fresh), "daily"); }
function cardDir(id) {

  if (d === "mix") { S.dirs = S.dirs || {}; return S.dirs[id] || (S.dirs[id] = Math.random() < .5 ? "fwd" : "rev"); }

}

function gradeCard(g) {
  const id = S.queue[0];
  const prev = P.cards[id];
  const dueNow = S.mode === "daily" || isDue(id) || !prev || prev.i < 1;

  if (S.undo.length > 20) S.undo.shift();

  ds.r++; if (g >= 2) ds.c++;
  P.cards[id] = schedule(prev, g, dueNow);
  if (!(id in S.results)) S.results[id] = g;

    <h2>About</h2><div class="card note" style="font-size:13px">
      <p style="margin-top:0"><b>Poneglyph</b> is a free, personal flashcard app. Nothing is sent anywhere; it works offline once loaded.</p>
      <p>Kanji data from <a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project" target="_blank" rel="noopener">KANJIDIC2</a> and words from <a href="https://www.edrdg.org/jmdict/j_jmdict.html" target="_blank" rel="noopener">JMdict</a> (© EDRDG, CC BY-SA 4.0), via <a href="https://github.com/davidluzgouveia/kanji-data" target="_blank" rel="noopener">kanji-data</a> and <a href="https://github.com/scriptin/jmdict-simplified" target="_blank" rel="noopener">jmdict-simplified</a>. Example sentences from <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> (CC BY 2.0 FR). JLPT word lists from <a href="https://github.com/jamsinclair/open-anki-jlpt-decks" target="_blank" rel="noopener">open-anki-jlpt-decks</a> (Jonathan Waller's lists, CC BY). Stroke order from <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> by Ulrich Apel (CC BY-SA 3.0).</p>
      <p style="margin-bottom:0">Dictionary version: ${D ? "loaded" : "loading"} · ${fmt(K.length)} kanji · ${D ? fmt(D.length) : "…"} words</p>
    </div>`;
}
function backup() {
  const data = JSON.stringify({app: "poneglyph", v: 1, saved: new Date().toISOString(), data: P});
  const name = `poneglyph-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, {type: "application/json"});
  const done = () => { P.lastBackup = Date.now(); save(true); render(); toast("Backup saved"); };
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    navigator.share({files: [file], title: "Poneglyph backup"}).then(done).catch(e => { if (e.name !== "AbortError") download(); });
  } else download();
  function download() { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); done(); }
}
$("#restore-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const d = j.data || j;
    if (!d.cards) throw new Error("not a backup");
    confirmSheet(`Restore this backup? It has ${Object.keys(d.cards).length} cards and will replace what's on this phone.`, "Restore", () => {
      localStorage.setItem(STORE, JSON.stringify(d)); P = load(); applyLook(); render(); toast("Backup restored");
    });
  } catch (err) { toast("That file isn't a Poneglyph backup"); }
});
function confirmSheet(msg, okLabel, fn) {
  sheetStack = ["#confirm"]; showSheet();
  $("#sheet-title").textContent = "Are you sure?"; $("#sheet-back").style.visibility = "hidden";
  $("#sheet-body").innerHTML = `<p style="font-size:16px;margin:18px 0">${esc(msg)}</p><div class="actions"><button class="btn" data-act="sheet-close">Cancel</button><button class="btn primary" id="confirm-ok">${esc(okLabel)}</button></div>`;
  $("#confirm-ok").onclick = () => { fn(); closeSheet(); };
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, s = P.set;
  const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
  switch (a) {
    case "tab": showTab(b.dataset.tab); break;
    case "search": openPage({type: "search", q: ""}); break;
    case "browse": {
      const type = b.dataset.type, lv = b.dataset.lvl;
      if (type === "kanji") { filt.kanji.lv = lv === undefined ? null : +lv; filt.kanji.q = ""; if (lv !== undefined) P.set.group = "jlpt"; }
      else { filt.vocab.lv = lv === "my" ? "my" : lv === undefined ? 5 : +lv; filt.vocab.q = ""; if (!D) loadDict(); }
      openPage({type}); break;
    }
    case "queue": openPage({type: "queue"}); break;
    case "page-back": showTab(tab); break;
    case "filter": sheetStack = ["#filter"]; showSheet(); renderSheet(); break;
    case "group": s.group = b.dataset.v; save(); renderPage(); break;
    case "st-toggle": {
      const f = page && page.type === "vocab" ? filt.vocab : filt.kanji;
      f.st = toggleIn(f.st, +b.dataset.s); if (!f.st.length) f.st = [0, 1, 2, 3, 4];
      renderPage(); if (sheetStack[0] === "#filter") renderSheet(true); break;
    }
    case "flv": filt.kanji.lv = b.dataset.v === "all" ? null : +b.dataset.v; renderPage(); renderSheet(true); break;
    case "clear-lv": filt.kanji.lv = null; renderPage(); break;
    case "vlv": filt.vocab.lv = b.dataset.v === "my" ? "my" : +b.dataset.v; renderPage(); $("#page-scroll").scrollTop = 0; break;
    case "open": openDetail(b.dataset.id); break;
    case "open-push": if (sheetStack.length && sheetStack[0] !== "#filter" && sheetStack[0] !== "#confirm") { sheetStack.push(b.dataset.id); addRecent(b.dataset.id); renderSheet(); } else openDetail(b.dataset.id); break;
    case "sheet-back": sheetStack.pop(); renderSheet(); break;
    case "sheet-close": closeSheet(); break;
    case "speak": e.stopPropagation(); speak(b.dataset.t); break;
    case "play-strokes": { const svg = $("#strokes svg"); if (svg) animateStrokes(svg); break; }
    case "play-card-strokes": { const svg = $("#card-strokes"); if (svg) animateStrokes(svg); break; }
    case "queue-toggle": { const id = b.dataset.id; P.queue = P.queue.includes(id) ? P.queue.filter(x => x !== id) : [...P.queue, id]; save(); toast(P.queue.includes(id) ? "Added to Learn next" : "Removed from the queue"); refreshAll(); break; }
    case "clear-queue": P.queue = []; save(); renderPage(); break;
    case "known": markKnown(b.dataset.id); toast("Marked as known"); break;
    case "reset": resetCard(b.dataset.id); toast("Progress reset"); break;
    case "study-one": closeSheet(); startSession([b.dataset.id], "custom"); break;
    case "my-toggle": { const i = b.dataset.i; P.my = P.my.includes(i) ? P.my.filter(x => x !== i) : [...P.my, i]; if (!P.my.includes(i)) delete P.cards["v" + i]; save(); toast(P.my.includes(i) ? "Added to my words" : "Removed"); refreshAll(); break; }
    case "start-daily": startDaily(); break;
    case "more-new": { const ds = dayStat(today()); if (s.decks.includes("k")) ds.nk = Math.max(0, ds.nk - 5); if (s.decks.includes("v")) ds.nv = Math.max(0, ds.nv - 5); save(); render(); break; }
    case "start-weak": {
      const pool = poolIds();
      let ids = pool.filter(id => { const l = level(id); return l === 1 || l === 2; });
      ids = ids.concat(Object.keys(P.cards).filter(id => level(id) === 1 && !ids.includes(id) && itemOf(id)));
      ids.sort((x, y) => level(x) - level(y) || (P.cards[x].i - P.cards[y].i));
      startSession(ids.slice(0, 40), "weak"); break;
    }
    case "start-custom": {
      let ids = poolIds().filter(id => s.custStatus.includes(level(id)));
      if (s.custOrder === "random") shuffle(ids);
      startSession(ids.slice(0, s.custCount), "custom"); break;
    }
    case "deck": s.decks = toggleIn(s.decks, b.dataset.v); if (!s.decks.length) s.decks = [b.dataset.v === "k" ? "v" : "k"]; save(); render(); break;
    case "lv": s.levels = toggleIn(s.levels, +b.dataset.v).sort((x, y) => y - x); save(); render(); break;
    case "inc-other": s.incOther = !s.incOther; save(); render(); break;
    case "inc-mine": s.incMine = !s.incMine; save(); render(); break;
    case "cust-st": s.custStatus = toggleIn(s.custStatus, +b.dataset.s); save(); render(); break;
    case "cust-n": s.custCount = +b.dataset.v; save(); render(); break;
    case "cust-o": s.custOrder = b.dataset.v; save(); render(); break;
    case "reveal": if (S && !S.revealed) { S.revealed = true; renderCard(); } break;
    case "grade": gradeCard(+b.dataset.g); break;
    case "undo": undo(); break;
    case "end-session": endSession(); break;
    case "step": { const k = b.dataset.k; s[k] = Math.min(+b.dataset.max, Math.max(+b.dataset.min, s[k] + +b.dataset.d)); save(); render(); break; }
    case "setv": s[b.dataset.k] = b.dataset.v; save(); applyLook(); render(); break;
    case "toggle": s[b.dataset.k] = !s[b.dataset.k]; save(); render(); break;
    case "backup": backup(); break;
    case "restore": $("#restore-file").click(); break;
    case "wipe": confirmSheet("Erase every card's progress, your words, notes and settings? Save a backup first if you might want it back.", "Erase everything", () => { localStorage.removeItem(STORE); P = load(); applyLook(); render(); toast("Progress erased"); }); break;
  }
});
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("input", e => { if (e.target.id === "note") { const id = e.target.dataset.id, v = e.target.value.trim(); if (v) P.notes[id] = e.target.value; else delete P.notes[id]; save(); } });
document.addEventListener("keydown", e => {
  if (!S || $("#session").hidden || e.target.matches("input,textarea")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!S.revealed) { S.revealed = true; renderCard(); } else gradeCard(3); }
  else if (S.revealed && /^[1-4]$/.test(e.key)) gradeCard(+e.key);
  else if (e.key === "z" && (e.metaKey || e.ctrlKey)) undo();
});

/* ---------- boot ---------- */
(async function boot() {
  try { await loadKanji(); } catch (e) { $("#lib").innerHTML = `<div class="empty">Couldn't load the kanji list. Check your connection and reopen the app.</div>`; return; }
  render();
  loadDict().then(() => { if (!page && !S) render(); else if (page) renderPage(); updateBadge(); }).catch(() => toast("Couldn't load the dictionary"));
  // a new study day: refresh counts when the app comes back to the foreground
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); if (!S) refreshAll(); } });
})();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
