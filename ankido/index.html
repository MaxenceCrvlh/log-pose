<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ankidō">
<meta name="description" content="Kanji and Japanese vocabulary flashcards with spaced repetition, in English or French. Your progress stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ankidō</title>
<style>
/* ============================================================
   Ankidō 暗記道 — design tokens (Apple HIG: system colors, SF type scale)
   ============================================================ */
:root{
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F2F2F7; --elev:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
  --tint:#3F4BC9; --tint-soft:rgba(63,75,201,.12); --on-tint:#FFFFFF;
  --material:rgba(249,249,251,.78);
  --s0:#1C1C1E; --s1:#E5342B; --s2:#C99400; --s3:#24963F; --s4:#0A6CFF;
  --s0-bg:rgba(120,120,128,.14); --s1-bg:rgba(229,52,43,.12); --s2-bg:rgba(240,180,0,.16); --s3-bg:rgba(36,150,63,.13); --s4-bg:rgba(10,108,255,.12);
  --paper-line:rgba(229,52,43,.28);
  --shadow-card:0 1px 1px rgba(0,0,0,.02),0 8px 28px rgba(0,0,0,.07);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",sans-serif;
  --cardfont:var(--jp);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:linear(0, .044, .15, .286, .43, .568, .689, .792, .873, .935, .979, 1.008, 1.026, 1.036, 1.038, 1.037, 1.033, 1.028, 1.022, 1.017, 1.012, 1.008, 1.005, 1.003, 1.001);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E; --elev:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --tint:#7D87FF; --tint-soft:rgba(125,135,255,.18); --on-tint:#FFFFFF;
  --material:rgba(28,28,30,.72);
  --s0:#F2F2F7; --s1:#FF453A; --s2:#FFD60A; --s3:#30D158; --s4:#409CFF;
  --s0-bg:rgba(118,118,128,.28); --s1-bg:rgba(255,69,58,.2); --s2-bg:rgba(255,214,10,.18); --s3-bg:rgba(48,209,88,.18); --s4-bg:rgba(64,156,255,.2);
  --paper-line:rgba(255,69,58,.35);
  --shadow-card:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg2:#1C1C1E; --bg3:#2C2C2E; --elev:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --tint:#7D87FF; --tint-soft:rgba(125,135,255,.18); --on-tint:#FFFFFF;
  --material:rgba(28,28,30,.72);
  --s0:#F2F2F7; --s1:#FF453A; --s2:#FFD60A; --s3:#30D158; --s4:#409CFF;
  --s0-bg:rgba(118,118,128,.28); --s1-bg:rgba(255,69,58,.2); --s2-bg:rgba(255,214,10,.18); --s3-bg:rgba(48,209,88,.18); --s4-bg:rgba(64,156,255,.2);
  --paper-line:rgba(255,69,58,.35);
  --shadow-card:none;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-font="textbook"]{--cardfont:"Klee One",var(--jp)}
:root[data-font="serif"]{--cardfont:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif CJK JP",serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;background:#000}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--ui);font-size:17px;line-height:1.29;letter-spacing:-.022em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--tint);text-decoration:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.jp{font-family:var(--jp)}
.num{font-variant-numeric:tabular-nums}
.l2{color:var(--label2)}
.foot{font-size:13px;line-height:18px;color:var(--label2);letter-spacing:-.006em}
.sub{font-size:15px;line-height:20px;letter-spacing:-.016em}
.tap{transition:transform .18s var(--ease),opacity .18s,background-color .2s}
.tap:active{transform:scale(.965);opacity:.85}

/* ---------- app frame & scenes ---------- */
#app{position:fixed;inset:0;background:var(--bg);transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s;transform-origin:50% 0;overflow:hidden}
#app.behind{transform:translateY(calc(env(safe-area-inset-top,0px) + 10px)) scale(.93);border-radius:14px;filter:brightness(.92)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scene.pushed{z-index:5;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.content{max-width:700px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.nav{position:absolute;top:0;left:0;right:0;z-index:4;padding-top:env(safe-area-inset-top,0px);transition:background-color .2s,box-shadow .2s}
.nav-in{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;max-width:760px;margin:0 auto;position:relative}
.nav-title{position:absolute;left:128px;right:128px;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nav.scrolled,.nav.always{background:var(--material);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav.scrolled .nav-title,.nav.always .nav-title{opacity:1}
.nav-sp{flex:1}
.back{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;height:44px;padding:0 8px 0 2px;max-width:150px;white-space:nowrap;overflow:hidden}
.back svg{width:24px;height:24px;flex:0 0 auto}
.circ{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--fill);color:var(--label);flex:0 0 auto}
.circ svg{width:20px;height:20px}
.circ.tinted{color:var(--tint);background:var(--tint-soft)}
.top-pad{height:calc(env(safe-area-inset-top,0px) + 44px)}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:2px 4px 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.large .jp{font-size:20px;font-weight:600;color:var(--tint);letter-spacing:.08em}
.large .cnt{font-size:20px;font-weight:600;color:var(--label2)}

/* floating tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none}
.tabbar .pill{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--material);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.12);position:relative;width:100%;max-width:420px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.01em;color:var(--label);position:relative;z-index:1;transition:color .25s}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-selected="true"]{color:var(--tint)}
.tabbar .hl{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--fill);transition:left .45s var(--spring),width .45s var(--spring)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--s1);color:#fff;font-size:12px;line-height:18px;font-weight:600;letter-spacing:0}

/* grouped lists */
.sec{margin:26px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 8px}
.sec-h h2{margin:0;font-size:20px;line-height:25px;font-weight:700;letter-spacing:.019em}
.sec-h button{font-size:15px;color:var(--tint)}
.sec-foot{margin:7px 16px 0}
.group{background:var(--bg2);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;width:100%;text-align:left;position:relative;background:var(--bg2)}
.row+.row::before,.wrow+.row::before,.row+.wrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.indent+.row.indent::before{left:58px}
button.row,a.row{transition:background-color .15s}
button.row:active,a.row:active{background:var(--fill2)}
button.row:disabled{opacity:.45}
.row .t{flex:1;min-width:0}
.row .t small{display:block;font-size:13px;line-height:17px;color:var(--label2);margin-top:1px}
.row .v{color:var(--label2);text-align:right;white-space:nowrap}
.chev{width:9px;height:15px;color:var(--label3);flex:0 0 auto}
.row .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.row .ico svg{width:19px;height:19px}
.row.danger{color:var(--s1)}
.row.tint{color:var(--tint)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;min-height:50px;padding:0 22px;font-size:17px;font-weight:600;background:var(--fill);color:var(--tint)}
.btn.fill{background:var(--tint);color:var(--on-tint)}
.btn.wide{width:100%}
.btn.small{min-height:34px;padding:0 14px;font-size:15px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.4}
.seg{position:relative;display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;position:relative;z-index:1;padding:6px 6px;font-size:13px;font-weight:500;line-height:17px;border-radius:7px;min-height:30px}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--elev);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .38s var(--spring),width .38s var(--spring)}
:root[data-theme="dark"] .seg .thumb{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .thumb{background:#636366}}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:0 0 auto;transition:background-color .25s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:#34C759}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:flex;background:var(--fill);border-radius:9px;overflow:hidden;flex:0 0 auto}
.stepper button{width:46px;height:32px;display:grid;place-items:center;font-size:20px;font-weight:500}
.stepper button+button{box-shadow:-.5px 0 0 var(--label3)}
.stepper button:active{background:var(--fill)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.chip .dot{width:8px;height:8px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px #fff}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scrollx::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:12px;padding:0 10px;height:38px}
.search svg{width:17px;height:17px;color:var(--label2);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;height:100%}
.search input::placeholder{color:var(--label2)}
textarea{width:100%;border:0;outline:none;background:var(--bg2);border-radius:14px;padding:12px 16px;font-size:17px;min-height:90px;resize:vertical;display:block}
input.field{flex:1;border:0;outline:none;background:none;font-size:17px;min-width:0}

/* status */
.c0{color:var(--s0)} .c1{color:var(--s1)} .c2{color:var(--s2)} .c3{color:var(--s3)} .c4{color:var(--s4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.d0{background:var(--s0)} .d1{background:var(--s1)} .d2{background:var(--s2)} .d3{background:var(--s3)} .d4{background:var(--s4)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.p0{background:var(--s0-bg)} .p1{background:var(--s1-bg);color:var(--s1)} .p2{background:var(--s2-bg)} .p3{background:var(--s3-bg);color:var(--s3)} .p4{background:var(--s4-bg);color:var(--s4)}
.mbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--fill)}
.mbar i{display:block;height:100%}
.mbar .b1{background:var(--s1)} .mbar .b2{background:var(--s2)} .mbar .b3{background:var(--s3)} .mbar .b4{background:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--label);font-weight:600}

/* library */
.today{background:var(--bg2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-card)}
.today .top{display:flex;align-items:center;gap:18px}
.ring{width:92px;height:92px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--fill)}
.ring .pr{stroke:var(--tint)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:24px;line-height:1}
.ring .in small{font-size:11px;font-weight:600;color:var(--label2);margin-top:3px}
.ring .in svg{width:34px;height:34px;transform:none}
.today h3{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:.017em}
.today .counts{display:flex;gap:20px;margin-top:8px}
.today .counts b{display:block;font-size:20px;font-weight:700}
.today .counts span{font-size:13px;color:var(--label2)}
.deck{background:var(--bg2);border-radius:22px;padding:16px;box-shadow:var(--shadow-card)}
.deck-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.deck-head .big{font-size:34px;font-weight:700;line-height:1;letter-spacing:.01em}
.deck-head .of{font-size:15px;color:var(--label2);margin-left:6px;font-weight:500}
.deck-head .lbl{font-size:13px;color:var(--label2);margin-top:5px}
.deck-glyph{margin-left:auto;font-family:var(--jp);font-size:46px;font-weight:700;line-height:1;color:var(--fill);-webkit-text-stroke:1px var(--label3)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lvl{background:var(--bg3);border-radius:14px;padding:10px 11px 11px;text-align:left}
.lvl b{display:block;font-size:17px;font-weight:600}
.lvl small{display:block;font-size:12px;color:var(--label2);margin:1px 0 7px}
.lvl .mbar{height:4px}
.recent{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;width:96px;padding:10px 8px;border-radius:16px;background:var(--bg2);text-align:center}
.recent .g{font-family:var(--jp);font-size:30px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .m{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* kanji grid & word lists */
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:3;background:var(--bg);margin:0 -16px;padding:6px 16px 10px}
.gh{display:flex;align-items:center;gap:12px;margin:20px 4px 8px;font-size:15px;font-weight:600}
.gh .mbar{flex:1;max-width:140px;margin-left:auto;height:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));background:var(--bg2);border-radius:14px;padding:6px}
.grid button{font-family:var(--jp);font-size:28px;line-height:1;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-weight:500;transition:transform .15s var(--ease),background-color .15s}
.grid button:active{background:var(--fill);transform:scale(.88)}
.grid button.q{background:var(--tint-soft)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 16px;min-height:58px;position:relative;background:var(--bg2)}
.wrow+.wrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.wrow:active{background:var(--fill2)}
.wrow .w{font-family:var(--jp);font-size:20px;font-weight:600;line-height:1.3}
.wrow .r{font-family:var(--jp);font-size:13px;color:var(--label2);margin-left:6px;font-weight:400}
.wrow .m{font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .kc{font-family:var(--jp);font-size:30px;font-weight:600;width:42px;text-align:center;flex:0 0 auto}
.tag{font-size:12px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:6px;padding:2px 6px;flex:0 0 auto}
.empty{text-align:center;color:var(--label2);padding:48px 24px;font-size:15px;line-height:21px}
.empty .g{font-family:var(--jp);font-size:56px;color:var(--label3);display:block;margin-bottom:10px;font-weight:300}
.loading{padding:40px;text-align:center;color:var(--label2);font-size:15px}

/* the practice square: the one bold element */
.paper{position:relative;aspect-ratio:1;border-radius:22px;background:var(--bg2);display:grid;place-items:center;overflow:hidden}
.paper::before,.paper::after{content:"";position:absolute;pointer-events:none}
.paper::before{left:50%;top:9%;bottom:9%;border-left:1.5px dashed var(--paper-line)}
.paper::after{top:50%;left:9%;right:9%;border-top:1.5px dashed var(--paper-line)}
.paper .g{position:relative;z-index:1;font-family:var(--cardfont);font-weight:500;line-height:1}
.paper svg.strk{position:absolute;inset:8%;width:84%;height:84%;z-index:2}
.strk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.strk .ghost{stroke:var(--fill);stroke-width:3.4}
.strk .ink{stroke:var(--label);stroke-width:3.4}
.strk text{font-size:6.5px;fill:var(--s1);font-family:var(--ui);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);opacity:0;transition:opacity .45s var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .5s var(--ease);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{flex:0 0 auto;padding:6px 0 0;display:flex;justify-content:center;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--label3)}
.sheet-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px 6px;min-height:48px;touch-action:none}

.facts small{font-size:12px;color:var(--label2)}
.read{font-family:var(--jp);font-size:18px}

.sense .pos{font-size:13px;color:var(--tint);font-weight:500;margin-bottom:1px}
.sense .gl{font-size:17px;line-height:22px}
.sense .mi{font-size:13px;color:var(--label2);margin-top:2px}
.sense .n{color:var(--label2);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.ex .ja{font-family:var(--jp);font-size:18px;line-height:1.6}
.ex mark{background:var(--tint-soft);color:inherit;border-radius:4px;padding:0 2px}

.plus{color:var(--label3);font-size:17px}
.story p{margin:0;font-size:17px;line-height:24px}
.story .by{font-size:13px;color:var(--label2);margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:8px 14px 8px 10px;text-align:left}
.kchip .g{font-family:var(--jp);font-size:30px;font-weight:600;line-height:1}
.kchip .m{font-size:13px;color:var(--label2);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);transform:translateY(100%);transition:transform .5s var(--ease)}
.session.on{transform:none}
.s-top{display:flex;align-items:center;gap:12px;padding:6px 12px;height:52px;flex:0 0 auto}

.fc .spk{position:absolute;right:12px;top:10px;z-index:3}

.fc.rev .front .fw{font-size:min(44px,10vw)}

.bk .ans{font-size:24px;line-height:30px;font-weight:700;text-align:center;letter-spacing:.01em}

.reveal{padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.reveal .btn{width:100%;min-height:62px;border-radius:18px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.done h2{margin:6px 0 0;font-size:28px;line-height:34px;font-weight:700}

.donegrid button{font-family:var(--jp);font-size:24px;font-weight:600;padding:4px 8px;border-radius:10px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg2);border-radius:18px;padding:14px 16px}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.tile small{font-size:13px;color:var(--label2)}

.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}

function level(id) {
  const c = P.cards[id];
  if (!c) return 0;
  if (c.g === 1 || c.i < 1) return 1;
  if (c.i < 7) return 2;
  if (c.i < 21) return 3;
  return 4;
}
function schedule(prev, g, isDueNow) {
  const td = today();
  const c = prev ? Object.assign({}, prev) : {i: 0, e: 2.5, d: td, r: 0, l: 0, n: 0, c: 0};
  c.n = (c.n || 0) + 1; if (g >= 2) c.c = (c.c || 0) + 1;
  c.t = Date.now();
  // extra practice on a card that isn't due: a miss counts, a pass leaves the schedule alone
  if (!isDueNow && g >= 2 && prev && prev.i >= 1) { c.g = g; return c; }
  if (g === 1) {
    if (c.r > 0 || c.i >= 1) c.l = (c.l || 0) + 1;
    c.r = 0; c.i = 0; c.e = Math.max(1.3, c.e - .2); c.d = td;
  } else {
    let i;
    if (g === 2) { i = c.i < 1 ? 1 : Math.max(c.i + 1, Math.round(c.i * 1.2)); c.e = Math.max(1.3, c.e - .15); }
    else if (g === 3) { i = c.i < 1 ? 1 : c.i < 3 ? 3 : Math.round(c.i * c.e); }
    else { i = c.i < 1 ? 4 : Math.round(Math.max(c.i + 2, c.i * c.e * 1.3)); c.e += .15; }
    if (i >= 7) i = Math.round(i * (0.95 + Math.random() * .1));
    c.i = Math.min(i, 3650); c.r++; c.d = td + c.i;
  }
  c.g = g;
  return c;
}

}

/* ---------- romaji -> kana ---------- */
const ROMA = (() => {
  const m = {a:"あ",i:"い",u:"う",e:"え",o:"お",n:"ん",nn:"ん","n'":"ん","-":"ー",
    ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
    sa:"さ",si:"し",shi:"し",su:"す",se:"せ",so:"そ",za:"ざ",zi:"じ",ji:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",
    ta:"た",ti:"ち",chi:"ち",tu:"つ",tsu:"つ",te:"て",to:"と",da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",
    na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",ha:"は",hi:"ひ",hu:"ふ",fu:"ふ",he:"へ",ho:"ほ",
    ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",
    ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",ya:"や",yu:"ゆ",yo:"よ",ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",
    wa:"わ",wo:"を",fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",
    sha:"しゃ",shu:"しゅ",sho:"しょ",she:"しぇ",cha:"ちゃ",chu:"ちゅ",cho:"ちょ",che:"ちぇ",ja:"じゃ",ju:"じゅ",jo:"じょ",je:"じぇ"};
  for (const [c, k] of Object.entries({k:"き",g:"ぎ",s:"し",z:"じ",t:"ち",d:"ぢ",n:"に",h:"ひ",b:"び",p:"ぴ",m:"み",r:"り"}))
    { m[c + "ya"] = k + "ゃ"; m[c + "yu"] = k + "ゅ"; m[c + "yo"] = k + "ょ"; }
  return m;
})();
function romaji2kana(s) {
  s = s.toLowerCase(); let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === s[i + 1] && /[bcdfghjkmprstwz]/.test(c)) { out += "っ"; i++; continue; }
    let hit = false;
    for (let n = 3; n >= 1; n--) {
      const part = s.substr(i, n);
      if (ROMA[part] && !(part === "n" && /[aiueoy]/.test(s[i + 1] || ""))) { out += ROMA[part]; i += n; hit = true; break; }
    }
    if (!hit) return null;
  }
  return out;
}

function search(qRaw) {

function poolIds(o = P.set) {
  const ids = [], lv = new Set(o.levels);
  if (o.decks.includes("k")) for (const k of K) if (k.j ? lv.has(k.j) : o.incOther) ids.push(kId(k.c));
  if (o.decks.includes("v") && D) {

function planDaily() {

  due.sort((a, b) => (level(a) - level(b)) || (P.cards[a].d - P.cards[b].d));
  due = due.slice(0, P.set.maxRev);
  const leftK = Math.max(0, P.set.newK - ds.nk), leftV = Math.max(0, P.set.newV - ds.nv);
  const fresh = []; let nk = 0, nv = 0;
  const take = id => {
    if (P.cards[id] || fresh.includes(id) || !itemOf(id)) return;
    if (id[0] === "k") { if (!P.set.decks.includes("k") || nk >= leftK) return; nk++; }
    else { if (!P.set.decks.includes("v") || nv >= leftV) return; nv++; }
    fresh.push(id);
  };
  P.queue.forEach(take);
  for (const id of pool) { if (nk >= leftK && nv >= leftV) break; take(id); }
  return {due, fresh};
}

}

      <p style="margin-top:0"><b style="color:var(--label)">Ankidō 暗記道</b>${fr ? " : « la voie de la mémorisation ». Cartes de kanji gratuites et personnelles. Rien n'est envoyé nulle part ; l'app fonctionne hors ligne une fois chargée." : ", “the way of memorizing”. Free, personal kanji flashcards. Nothing is sent anywhere; it works offline once loaded."}</p>
      <p>Kanji : <a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project" target="_blank" rel="noopener">KANJIDIC2</a>. ${fr ? "Mots" : "Words"} : <a href="https://www.edrdg.org/jmdict/j_jmdict.html" target="_blank" rel="noopener">JMdict</a> (© EDRDG, CC BY-SA 4.0), ${fr ? "via" : "via"} <a href="https://github.com/scriptin/jmdict-simplified" target="_blank" rel="noopener">jmdict-simplified</a> ${fr ? "et" : "and"} <a href="https://github.com/davidluzgouveia/kanji-data" target="_blank" rel="noopener">kanji-data</a>. ${fr ? "Exemples" : "Examples"} : <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> (CC BY 2.0 FR). JLPT : <a href="https://github.com/jamsinclair/open-anki-jlpt-decks" target="_blank" rel="noopener">open-anki-jlpt-decks</a>. ${fr ? "Ordre des traits et composants" : "Stroke order and parts"} : <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> (CC BY-SA 3.0).</p>
      <p style="margin-bottom:0" class="num">${fmt(K.length)} kanji, ${D ? fmt(D.length) : "…"} ${fr ? "mots" : "words"}</p>
    </div></div>
  </div></div>`;
  placeThumbs(root);
  const ak = $("#apikey", root);
  ak.onfocus = () => { if (ak.value.startsWith("••")) ak.value = ""; };
  ak.onchange = () => { const v = ak.value.trim(); if (v && !v.startsWith("••")) { localStorage.setItem(KEYSTORE, v); toast(t("Key saved")); render(); } };
}
function backup() {
  const data = JSON.stringify({app: "ankido", v: 1, saved: new Date().toISOString(), data: P});
  const name = `ankido-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, {type: "application/json"});
  const done = () => { P.lastBackup = Date.now(); save(true); render(); toast(t("Backup saved")); };
  const download = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); done(); };
  if (navigator.canShare && navigator.canShare({files: [file]})) navigator.share({files: [file], title: "Ankidō"}).then(done).catch(e => { if (e.name !== "AbortError") download(); });
  else download();
}
$("#restore-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), d = j.data || j;
    if (!d.cards) throw new Error("not a backup");
    confirmSheet(t("Restore this backup? It has {n} cards and replaces what's on this phone.", {n: Object.keys(d.cards).length}), t("Restore"), () => {
      localStorage.setItem(STORE, JSON.stringify(d)); P = load(); applyLook(); render(); toast(t("Backup restored"));
    });
  } catch (err) { toast(t("That file isn't an Ankidō backup")); }
});
function confirmSheet(msg, okLabel, fn) {
  sheetStack = ["#confirm"]; showSheet();
  $("#sheet-title").textContent = t("Are you sure?"); $("#sheet-back").style.visibility = "hidden";
  $("#sheet-body").innerHTML = `<p style="font-size:17px;line-height:23px;margin:16px 4px 22px">${esc(msg)}</p><div class="group"><button class="row danger" id="confirm-ok" style="justify-content:center;font-weight:600">${esc(okLabel)}</button></div><div class="sec" style="margin-top:10px"><div class="group"><button class="row tint" data-act="sheet-close" style="justify-content:center">${t("Cancel")}</button></div></div>`;
  $("#confirm-ok").onclick = () => { fn(); closeSheet(); };
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, s = P.set;
  if (!a) return;
  const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
  const seg = () => { const sg = b.closest("[data-seg]"); if (sg) { $$("button", sg).forEach(x => x.setAttribute("aria-pressed", x === b)); placeThumbs(sg.parentElement); } };
  switch (a) {
    case "tab": showTab(b.dataset.tab); break;
    case "search": openPage({type: "search", q: ""}); break;
    case "browse": {
      const type = b.dataset.type, lv = b.dataset.lvl;
      if (type === "kanji") { filt.kanji.lv = lv === undefined ? null : +lv; filt.kanji.q = ""; if (lv !== undefined) s.group = "jlpt"; }
      else { filt.vocab.lv = lv === "my" ? "my" : lv === undefined ? 5 : +lv; filt.vocab.q = ""; if (!D) loadDict(); }
      openPage({type}); break;
    }
    case "queue": openPage({type: "queue"}); break;
    case "page-back": closePage(); break;
    case "theme-cycle": { s.theme = s.theme === "auto" ? "light" : s.theme === "light" ? "dark" : "auto"; save(); applyLook(); render(); toast(s.theme === "auto" ? t("Matches your phone") : s.theme === "light" ? t("Light mode") : t("Dark mode")); break; }
    case "filter": sheetStack = ["#filter"]; showSheet(); renderSheet(); break;
    case "group": seg(); s.group = b.dataset.v; save(); setTimeout(() => renderPage(), 140); break;
    case "vlv": seg(); filt.vocab.lv = b.dataset.v === "my" ? "my" : +b.dataset.v; setTimeout(() => renderPage(true), 140); break;
    case "st-toggle": { const f = page && page.type === "vocab" ? filt.vocab : filt.kanji, v = +b.dataset.s; f.st = f.st.length === 5 ? [v] : toggleIn(f.st, v); if (!f.st.length) f.st = [0, 1, 2, 3, 4]; renderPage(); break; }
    case "st-only": { const f = page && page.type === "vocab" ? filt.vocab : filt.kanji, v = +b.dataset.s; f.st = toggleIn(f.st, v); if (!f.st.length) f.st = [0, 1, 2, 3, 4]; renderPage(); renderSheet(true); break; }
    case "flv": filt.kanji.lv = b.dataset.v === "all" ? null : +b.dataset.v; renderPage(); renderSheet(true); break;
    case "clear-queue": P.queue = []; save(); renderPage(); break;
    case "open": openDetail(b.dataset.id); break;
    case "open-push": pushDetail(b.dataset.id); break;
    case "sheet-back": sheetStack.pop(); renderSheet(); break;
    case "sheet-close": closeSheet(); break;
    case "speak": e.stopPropagation(); speak(b.dataset.t); break;
    case "play-strokes": { const svg = $("#strokes-box svg"); if (svg) animateStrokes(svg); break; }
    case "ai-story": aiStory(b.dataset.c); break;
    case "queue-toggle": { const id = b.dataset.id; P.queue = P.queue.includes(id) ? P.queue.filter(x => x !== id) : [...P.queue, id]; save(); toast(P.queue.includes(id) ? t("Added to Learn next") : t("Removed from the queue")); refreshAll(); break; }
    case "known": markKnown(b.dataset.id); toast(t("Marked as known")); break;
    case "reset": resetCard(b.dataset.id); toast(t("Progress reset")); break;
    case "study-one": closeSheet(); startSession([b.dataset.id], "custom"); break;
    case "my-toggle": { const i = b.dataset.i; P.my = P.my.includes(i) ? P.my.filter(x => x !== i) : [...P.my, i]; if (!P.my.includes(i)) delete P.cards["v" + i]; save(); toast(P.my.includes(i) ? t("Added to my words") : t("Removed from my words")); refreshAll(); break; }
    case "start-daily": startDaily(); break;
    case "more-new": { const ds = dayStat(today()); if (s.decks.includes("k")) ds.nk = Math.max(0, ds.nk - 5); if (s.decks.includes("v")) ds.nv = Math.max(0, ds.nv - 5); save(); render(); break; }
    case "start-weak": {
      const pool = poolIds();
      let ids = pool.filter(id => { const l = level(id); return l === 1 || l === 2; });
      const have = new Set(ids);
      ids = ids.concat(Object.keys(P.cards).filter(id => level(id) === 1 && !have.has(id) && itemOf(id)));
      ids.sort((x, y) => level(x) - level(y) || (P.cards[x].i - P.cards[y].i));
      startSession(ids.slice(0, 40), "weak"); break;
    }
    case "start-custom": { let ids = poolIds().filter(id => s.custStatus.includes(level(id))); if (s.custOrder === "random") shuffle(ids); startSession(ids.slice(0, s.custCount), "custom"); break; }
    case "deck": s.decks = toggleIn(s.decks, b.dataset.v); if (!s.decks.length) s.decks = [b.dataset.v === "k" ? "v" : "k"]; save(); b.setAttribute("aria-checked", s.decks.includes(b.dataset.v)); setTimeout(render, 300); break;
    case "lv": s.levels = toggleIn(s.levels, +b.dataset.v).sort((x, y) => y - x); save(); render(); break;
    case "inc-other": s.incOther = !s.incOther; save(); b.setAttribute("aria-checked", s.incOther); setTimeout(render, 300); break;
    case "inc-mine": s.incMine = !s.incMine; save(); b.setAttribute("aria-checked", s.incMine); setTimeout(render, 300); break;
    case "cust-st": s.custStatus = toggleIn(s.custStatus, +b.dataset.s); save(); render(); break;
    case "cust-n": seg(); s.custCount = +b.dataset.v; save(); setTimeout(render, 200); break;
    case "cust-o": seg(); s.custOrder = b.dataset.v; save(); break;
    case "reveal": reveal(); break;
    case "grade": gradeCard(+b.dataset.g); break;
    case "undo": undo(); break;
    case "end-session": endSession(); break;
    case "step": { const k = b.dataset.k; s[k] = Math.min(+b.dataset.max, Math.max(+b.dataset.min, s[k] + +b.dataset.d)); save(); render(); break; }
    case "setv": seg(); s[b.dataset.k] = b.dataset.v; save(); setTimeout(() => { applyLook(); render(); }, 180); break;
    case "toggle": s[b.dataset.k] = !s[b.dataset.k]; b.setAttribute("aria-checked", s[b.dataset.k]); save(); break;
    case "use-tl": localStorage.setItem(KEYSTORE, tlKey()); toast(t("Key saved")); render(); break;
    case "del-key": localStorage.removeItem(KEYSTORE); toast(t("Key removed")); render(); break;
    case "backup": backup(); break;
    case "restore": $("#restore-file").click(); break;
    case "wipe": confirmSheet(t("Erase every card's progress, your words, notes and settings? Save a backup first if you might want it back."), t("Erase everything"), () => { localStorage.removeItem(STORE); P = load(); applyLook(); render(); toast(t("Progress erased")); }); break;
  }
});
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("input", e => { if (e.target.id === "note") { const id = e.target.dataset.id; if (e.target.value.trim()) P.notes[id] = e.target.value; else delete P.notes[id]; save(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (sheetStack.length) closeSheet(); else if (page) closePage(); return; }
  if (!S || $("#session").hidden || e.target.matches("input,textarea") || sheetStack.length) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!S.revealed) reveal(); else gradeCard(3); }
  else if (S.revealed && /^[1-4]$/.test(e.key)) gradeCard(+e.key);
});
addEventListener("resize", () => { moveTabHighlight(); placeThumbs(); });

/* ---------- boot ---------- */
(async function boot() {
  try { await loadKanji(); } catch (e) { $("#scene-root").innerHTML = `<div class="empty" style="margin-top:30vh">${t("Couldn't load the kanji list. Check your connection and reopen the app.")}</div>`; return; }
  render(true);
  requestAnimationFrame(moveTabHighlight);
  loadDict().then(() => { if (!S) { if (page) renderPage(); else render(); } updateBadge(); }).catch(() => toast(t("Loading the dictionary…")));
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); if (!S) refreshAll(); } });
})();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
